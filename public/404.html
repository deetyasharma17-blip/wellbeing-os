<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      const path = window.location.pathname
      const base = path.split('/').filter(Boolean)[0]
      const redirect = base ? `/${base}/` : '/'
      window.location.replace(`${redirect}?redirect=${encodeURIComponent(path + window.location.search)}`)
    </script>
  </head>
  <body>Redirecting…</body>
</html>
